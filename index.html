<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTS World | Discography</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; transition: all 0.3s ease; }
        
        /* Default Dark Mode Styles */
        .purple-gradient { background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 100%); transition: background 0.3s ease; }
        .glass { background: rgba(202, 45, 238, 0.705); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }

        /* Light Mode Classes */
        body.light-mode { background-color: #f3f4f6; color: #1f2937; }
        .light-mode .purple-gradient { background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%); }
        .light-mode nav { border-color: rgba(0, 0, 0, 0.1); }
        .light-mode .text-purple-400 { color: #6d28d9; }
        .light-mode .text-purple-200 { color: #f3f4f6; }
        .light-mode .bg-black\/30 { background-color: rgba(255, 255, 255, 0.5); }
        .light-mode #searchInput { color: #111827; }
        .light-mode #searchInput::placeholder { color: #6b7280; }
        .light-mode .border-white\/20 { border-color: rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-black text-white min-h-screen">

    <nav class="p-6 flex justify-between items-center border-b border-white/10">
        <div class="flex items-center gap-3">
            <!-- Logo Box -->
            <div id="logo-container" class="w-10 h-10 bg-white flex items-center justify-center rounded-sm transition-colors">
                <div class="w-6 h-6 flex justify-between">
                    <div id="logo-bar-1" class="w-2.5 h-full bg-black"></div>
                    <div id="logo-bar-2" class="w-2.5 h-full bg-black"></div>
                </div>
            </div>
            <span class="font-black text-2xl tracking-tighter italic">BTS ARCHIVE</span>
        </div>

        <div class="flex items-center gap-4">
            <div class="text-sm text-purple-400 font-bold tracking-widest hidden sm:block">방탄소년단</div>
            
            <!-- THEME TOGGLE BUTTON -->
            <button onclick="toggleTheme()" class="p-2 rounded-full border border-white/20 hover:bg-white/10 transition active:scale-90">
                <span id="theme-icon" class="text-xl">🌙</span>
            </button>
        </div>
    </nav>

    <header class="py-20 px-6 text-center purple-gradient">
        <h2 class="text-6xl md:text-8xl font-black mb-4 tracking-tighter text-white">DISCOGRAPHY</h2>
        <p class="text-purple-200 max-w-lg mx-auto mb-10">Explore the musical journey of BTS.</p>
        
        <div class="max-w-xl mx-auto flex gap-2 p-2 bg-black/30 rounded-full border border-white/20 shadow-lg">
            <input type="text" id="searchInput" placeholder="Search song or album (e.g. Dynamite)..." 
                class="bg-transparent flex-1 px-6 outline-none text-white">
            <button onclick="fetchBTS()" class="bg-white text-black px-8 py-3 rounded-full font-black hover:bg-purple-300 transition">SEARCH</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-10">
        <div id="status" class="text-center text-gray-500 mb-10">Showing latest official releases...</div>
        <div id="results" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
            <!-- Dito papasok yung data from app.js -->
        </div>
    </main>

    <script>
        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('theme-icon');
            const logoContainer = document.getElementById('logo-container');
            const bar1 = document.getElementById('logo-bar-1');
            const bar2 = document.getElementById('logo-bar-2');

            // Toggle the class on the body
            body.classList.toggle('light-mode');

            if (body.classList.contains('light-mode')) {
                themeIcon.innerText = '☀️';
                // Invert logo colors for light mode
                logoContainer.style.backgroundColor = 'black';
                bar1.style.backgroundColor = 'white';
                bar2.style.backgroundColor = 'white';
            } else {
                themeIcon.innerText = '🌙';
                // Back to original logo colors
                logoContainer.style.backgroundColor = 'white';
                bar1.style.backgroundColor = 'black';
                bar2.style.backgroundColor = 'black';
            }
        }
    </script>
    <script src="app.js"></script>
</body>
</html>
